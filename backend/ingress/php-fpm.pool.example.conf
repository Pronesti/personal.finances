; Independent local/deployment pool template. Replace every absolute path and choose
; actual production placement separately. Do not include it in another app's pool.
[global]
daemonize = no
pid = /absolute/private/runtime/php-fpm.pid
error_log = /absolute/private/runtime/php-fpm.log
[tarjetas]
listen = /absolute/private/runtime/php-fpm.sock
listen.mode = 0600
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 30s
clear_env = no
catch_workers_output = yes
security.limit_extensions = .php
request_terminate_timeout = 735s
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /absolute/private/runtime/php-errors.log
php_admin_value[max_execution_time] = 730
php_admin_value[max_input_time] = 185
php_admin_value[upload_max_filesize] = 40M
php_admin_value[post_max_size] = 48M
php_admin_value[max_file_uploads] = 20
php_admin_value[memory_limit] = 1024M
php_admin_value[upload_tmp_dir] = /absolute/private/uploads
php_admin_value[sys_temp_dir] = /absolute/private/temp
